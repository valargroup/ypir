[package]
name = "valar-ypir"
version = "0.2.0"
edition = "2021"
description = "Fork of YPIR: High-Throughput Single-Server PIR with Silent Preprocessing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/ypir"

[build-dependencies]
cc = "1.0"

[features]
default = ["server"]
server = []
rayon = ["dep:rayon"]
explicit_avx512 = []
http_server = ["actix-web", "actix-http", "actix-cors", "futures", "bzip2", "base64"]
http_client = ["reqwest"]
# Enables the CLI deps used by the `client` / `server` / `run` binaries.
# Library consumers should not enable this — it pulls in `clap` and
# `env_logger` and their transitive trees.
cli = ["dep:clap", "dep:env_logger"]

[dependencies]
spiral-rs = { package = "valar-spiral-rs", version = "0.5" }
rayon = { version = "1", optional = true }
rand = { version = "0.8.5", features = ["small_rng"] }
rand_chacha = "0.3.1"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
fastrand = "2"
log = "0.4"
env_logger = { version = "0.11", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

actix-web = { optional = true, version = "4", default_features = false, features = ["macros", "compress-gzip"] }
actix-http = { optional = true, version = "3.7.0" }
actix-cors = { optional = true, version = "0.7.0" }
futures = { optional = true, version = "0.3" }
bzip2 = { optional = true, version = "0.4.4" }
base64 = { optional = true, version = "0.22.1" }
reqwest = { optional = true, version = "0.12", features = ["blocking"] }
sha1 = { version = "0.10.6" }

[dev-dependencies]
test-log = "0.2"

# The client / server / run binaries pull in optional deps (reqwest, actix-web,
# clap, env_logger) that are only enabled by the `http_client` / `http_server`
# / `cli` features. Declaring `required-features` here keeps `cargo build` /
# `cargo publish` with default features from trying to compile these bins
# without their optional deps, which would fail.
[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["http_server", "cli"]

[[bin]]
name = "client"
path = "src/bin/client.rs"
required-features = ["http_client", "cli"]

[[bin]]
name = "run"
path = "src/bin/run.rs"
required-features = ["server", "cli"]

[[bin]]
name = "analyze-sp"
path = "src/bin/analyze-sp.rs"
required-features = ["cli"]


# [profile.release]
# lto = "fat"

[profile.release-with-debug]
inherits = "release"
debug = true
